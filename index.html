<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KylKoll</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <img src="assets/logos/kylkoll_logo_white_text.png" alt="KylKoll logotyp">

        <button>☰</button>
    </header>

    <main>

        <section class="toolbar">

            <input
                type="text"
                class="search-input"
                placeholder="Sök i kylen..."
            >

            <div class="toolbar-row">

                <select class="sort-select">
                    <option>Senast tillagt</option>
                    <option>Bäst före</option>
                    <option>A–Ö</option>
                    <option>Minst kvar</option>
                </select>

                <button class="add-button">+</button>

            </div>

        </section>

        <section class="product-grid">

            <article class="product-card">

                <div class="product-image"></div>

                <div class="product-info">
                    <h2>Mjölk</h2>

                    <p class="expiry">Bäst före: 24 aug</p>

                    <p class="opened">Öppnad</p>

                    <div class="amount-control">

                        <button class="amount-button">
                            75 % kvar
                        </button>

                        <div class="slider-container">
                            <input
                                type="range"
                                class="amount-slider"
                                min="0"
                                max="100"
                                value="75"
                            >
                        </div>

                    </div>
                </div>

            </article>

            <article class="product-card">

                <div class="product-image"></div>
            
                <div class="product-info">
                    <h2>Keso</h2>
            
                    <p class="expiry">Bäst före: 24 aug</p>
            
                    <p class="opened">Oöppnad</p>
            
                    <div class="amount-control">

                        <button class="amount-button">
                            100 % kvar
                        </button>

                        <div class="slider-container">
                            <input
                                type="range"
                                class="amount-slider"
                                min="0"
                                max="100"
                                value="100"
                            >
                        </div>

                    </div>
                </div>
            
            </article>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>

</body>
</html>
